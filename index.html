<style>
  :root{
    --bg: #f6f9fd;
    --bg-2: #eaf1fa;
    --card: #ffffff;
    --card-hover: #eef4fb;
    --ink: #1e3a5c;
    --ink-dim: #5c7796;
    --ink-faint: #9db1c9;
    --milk: #4576ab;
    --milk-dim: #dce8f6;
    --diaper: #7fa5c9;
    --diaper-dim: #e9f0f8;
    --sage: #7fa5c9;
    --line: #e2eaf3;
    --radius: 18px;
    --bg-glow: #e4eefb;
  }
  html[data-theme="dark"]{
    --bg: #0e1826;
    --bg-2: #16253a;
    --card: #16253a;
    --card-hover: #1c2e47;
    --ink: #eaf1fa;
    --ink-dim: #93a9c4;
    --ink-faint: #5d7291;
    --milk: #6fa3d8;
    --milk-dim: #203955;
    --diaper: #4c7aab;
    --diaper-dim: #1c2f47;
    --sage: #6fa3d8;
    --line: #223752;
    --bg-glow: #16253a;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
    transition: background-color .3s ease, color .3s ease;
  }
  .wrap{
    max-width: 560px; margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
  }

  header{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom: 26px; }
  header h1{
    font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic;
    font-size: 44px; margin:0; letter-spacing: 0.01em; color: var(--ink);
  }
  header h1 .dot{ color: var(--milk); }
  header .subtitle{
    font-size: 11px; color: var(--ink-faint); margin-top: 4px;
    text-transform: uppercase; letter-spacing: .14em;
  }

  .stats{
    margin-bottom:22px;
  }
  .stat-hero{
    background: var(--milk); color:#ffffff; border-radius: var(--radius);
    padding: 18px 20px; margin-bottom:10px; display:flex; align-items:baseline; justify-content:space-between;
  }
  .stat-hero .num{ font-family:'Fraunces', serif; font-size: 34px; font-weight:600; }
  .stat-hero .lbl{
    font-size: 11px; text-transform:uppercase; letter-spacing:.1em; opacity:.85;
  }
  .stats-row{
    display:grid; grid-template-columns: repeat(2,1fr); gap:10px;
  }
  .stat{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px 10px; text-align:center;
  }
  .stat .num{ font-family:'Fraunces', serif; font-size: 22px; font-weight:600; }
  .stat .lbl{ font-size: 10.5px; color: var(--ink-faint); margin-top:2px; text-transform:uppercase; letter-spacing:.06em; }

  .card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px;
  }
  .card h2{
    font-family:'Fraunces', serif; font-size:16px; font-weight:600; margin:0 0 14px 0;
    color: var(--ink);
  }

  label.field-label{
    display:block; font-size:11.5px; color: var(--ink-faint); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:8px; margin-top:16px;
  }
  label.field-label:first-child{ margin-top:0; }

  .time-row{ display:flex; gap:10px; align-items:center; }
  input[type="time"], input[type="date"]{
    flex:1; background: var(--bg-2); border:1px solid var(--line); color: var(--ink);
    font-family:'Inter'; font-size:17px; font-weight:500; padding:14px 16px; border-radius:12px;
  }
  input[type="date"]{ width:100%; }
  .now-btn{
    background: var(--bg-2); border:1px solid var(--line); color: var(--ink-dim);
    width:50px; height:50px; border-radius:12px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .now-btn:active{ background: var(--card-hover); }

  .ml-row{ display:flex; align-items:center; gap:12px; }
  .ml-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
    background: var(--bg-2); color: var(--ink); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .ml-btn:active{ background: var(--milk-dim); }
  .ml-input-wrap{
    flex:1; display:flex; align-items:baseline; justify-content:center; gap:6px;
    background: var(--bg-2); border:1px solid var(--line); border-radius:12px; padding: 10px 8px;
  }
  input#ml-input{
    width: 90px; background:transparent; border:none; color:var(--milk);
    font-family:'Fraunces', serif; font-size: 28px; font-weight:600; text-align:right;
    outline:none; min-width:0;
  }
  .ml-unit{ color: var(--ink-faint); font-size:14px; }

  .quick-ml{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .quick-ml button{
    background: var(--bg-2); border:1px solid var(--line); color: var(--ink-dim);
    padding: 7px 12px; border-radius: 20px; font-size:12.5px; cursor:pointer; font-family:'Inter';
  }
  .quick-ml button.active{ background: var(--milk-dim); color: var(--milk); border-color: var(--milk-dim); }

  .diaper-row{ display:grid; grid-template-columns: repeat(4,1fr); gap:8px; }
  .diaper-btn{
    background: var(--bg-2); border:1px solid var(--line); color: var(--ink-dim);
    padding: 12px 4px; border-radius:12px; cursor:pointer; font-family:'Inter'; font-size:12px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .diaper-btn .ic{ font-size:18px; }
  .diaper-btn.active{ background: var(--diaper-dim); color: var(--diaper); border-color: var(--diaper-dim); }

  .save-btn{
    width:100%; margin-top:20px; background: var(--milk); color: #ffffff;
    border:none; padding:15px; border-radius:14px; font-family:'Inter'; font-weight:700;
    font-size:15px; cursor:pointer; letter-spacing:.01em;
  }
  .save-btn:active{ transform: scale(0.99); }

  /* Timeline */
  .day-label{
    font-size:12px; color: var(--ink-faint); text-transform:uppercase; letter-spacing:.08em;
    margin: 26px 0 12px 4px;
  }
  .timeline{ position:relative; padding-left: 26px; }
  .timeline::before{
    content:''; position:absolute; left:9px; top:6px; bottom:6px; width:1.5px;
    background: var(--line);
  }
  .entry{ position:relative; margin-bottom: 16px; }
  .entry .node{
    position:absolute; left:-26px; top:2px; width:18px; height:18px; border-radius:50%;
    background: var(--milk-dim); border: 2px solid var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  .entry-card{
    background: var(--card); border:1px solid var(--line); border-radius:14px;
    padding: 12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .entry-main{ display:flex; align-items:center; gap:12px; }
  .entry-time{ font-family:'Fraunces', serif; font-size:15px; color: var(--ink); min-width:44px; }
  .entry-details{ display:flex; flex-direction:column; gap:2px; }
  .entry-ml{ font-size:14px; color: var(--milk); font-weight:600; }
  .entry-diaper{ font-size:11.5px; color: var(--ink-faint); }
  .entry-author{
    width:20px; height:20px; border-radius:50%; background: var(--milk-dim); color: var(--milk);
    font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; text-transform:uppercase;
  }

  .fab{
    position:fixed; right:20px; bottom: calc(22px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; background: var(--milk); color:#ffffff;
    border:none; box-shadow: 0 8px 20px rgba(0,0,0,.25); display:flex; align-items:center;
    justify-content:center; cursor:pointer; z-index:20; transition: background-color .3s ease, transform .15s ease;
  }
  .fab:active{ transform: scale(0.94); }

  .same-as-last-btn{
    background: var(--bg-2); border:1px solid var(--line); color: var(--ink-dim);
    font-family:'Inter'; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:20px;
    cursor:pointer; margin-top:14px; display:inline-flex; align-items:center; gap:6px;
  }
  .same-as-last-btn:active{ background: var(--card-hover); }
  .entry-del{
    background:none; border:none; color: var(--ink-faint); font-size:16px; cursor:pointer;
    padding:6px; border-radius:8px; transition: background-color .15s ease, color .15s ease;
  }
  .entry-del:active{ color: var(--diaper); }
  .entry-del.confirming{
    background: #c0526a; color:#ffffff; font-size:11px; font-weight:600; padding:6px 10px;
    white-space:nowrap;
  }
  .entry-edit{
    background:none; border:none; color: var(--ink-faint); cursor:pointer;
    padding:6px; display:flex; align-items:center; justify-content:center;
  }
  .entry-edit:active{ color: var(--milk); }
  .entry-actions{ display:flex; align-items:center; gap:2px; }

  .cancel-edit-btn{
    width:100%; margin-top:10px; background:none; border:1px solid var(--line); color: var(--ink-dim);
    padding:13px; border-radius:14px; font-family:'Inter'; font-weight:600; font-size:14px; cursor:pointer;
  }

  .empty{
    text-align:center; color: var(--ink-faint); font-size:13px; padding: 30px 10px;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--card); border:1px solid var(--line); color: var(--ink);
    padding:12px 20px; border-radius:30px; font-size:13px; opacity:0; pointer-events:none;
    transition: all .25s ease; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Tabs */
  .tabs{
    display:flex; gap:6px; background: var(--card); border:1px solid var(--line);
    border-radius:14px; padding:4px; margin-bottom:22px;
  }
  .tab-btn{
    flex:1; background:none; border:none; color: var(--ink-faint); font-family:'Inter';
    font-size:12px; font-weight:600; padding:10px 4px; border-radius:10px; cursor:pointer;
  }
  .tab-btn.active{ background: var(--bg-2); color: var(--ink); }
  .view{ display:none; }
  .view.active{ display:block; }
  .view{ transition: transform .2s ease, opacity .2s ease; }
  .view.tab-slide-out-l{ transform: translateX(-26px); opacity:0; }
  .view.tab-slide-out-r{ transform: translateX(26px); opacity:0; }
  .view.tab-slide-in-prep-l{ transition:none; transform: translateX(26px); opacity:0; }
  .view.tab-slide-in-prep-r{ transition:none; transform: translateX(-26px); opacity:0; }

  /* Calendar */
  .cal-nav{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
  }
  .cal-nav-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background: var(--card); color: var(--ink); font-size:16px; cursor:pointer;
  }
  .cal-nav-title{
    font-family:'Fraunces', serif; font-size:17px; font-weight:600; text-transform:capitalize;
  }
  .cal-grid{
    display:grid; grid-template-columns: repeat(7,1fr); gap:6px; margin-bottom:22px;
    touch-action: pan-y;
    transition: transform .22s ease, opacity .22s ease;
  }
  .cal-grid.slide-out-l{ transform: translateX(-24px); opacity:0; }
  .cal-grid.slide-out-r{ transform: translateX(24px); opacity:0; }
  .cal-grid.slide-in-prep-l{ transition:none; transform: translateX(24px); opacity:0; }
  .cal-grid.slide-in-prep-r{ transition:none; transform: translateX(-24px); opacity:0; }
  .cal-nav-title{ transition: opacity .18s ease; }
  .cal-dow{
    text-align:center; font-size:10.5px; color: var(--ink-faint); text-transform:uppercase;
    padding-bottom:4px;
  }
  .cal-day{
    aspect-ratio:1; border-radius:10px; border:1px solid transparent; background: var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; font-size:13px; color: var(--ink-dim); gap:3px; position:relative;
  }
  .cal-day.empty-cell{ background:none; cursor:default; }
  .cal-day.has-entries{ color: var(--ink); }
  .cal-day .dot{
    width:5px; height:5px; border-radius:50%; background: var(--milk);
  }
  .cal-day.selected{ border-color: var(--milk); background: var(--milk-dim); color: var(--ink); }
  .cal-day.is-today{ box-shadow: inset 0 0 0 1px var(--sage); }

  .cal-day-detail-label{
    font-family:'Fraunces', serif; font-size:16px; font-weight:600; margin: 4px 0 12px 2px;
  }

  /* Chart */
  .chart-scroll{
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 18px 6px 10px;
  }
  .chart-scroll svg{ display:block; }
  .chart-empty{ text-align:center; color: var(--ink-faint); font-size:13px; padding: 40px 10px; }

  /* Login */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    width:100%; max-width:340px; background: var(--card); border:1px solid var(--line);
    border-radius: var(--radius); padding: 32px 26px; text-align:center;
  }
  .login-title{
    font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic;
    font-size: 40px; margin:0 0 2px 0; color: var(--ink);
  }
  .login-sub{
    font-size: 11px; color: var(--ink-faint); text-transform:uppercase; letter-spacing:.14em;
    margin: 0 0 26px 0;
  }
  .login-field{
    width:100%; background: var(--bg-2); border:1px solid var(--line); color: var(--ink);
    font-family:'Inter'; font-size:16px; padding:14px 16px; border-radius:12px;
    margin-bottom:10px; text-align:left;
  }
  .login-btn{
    width:100%; margin-top:10px; background: var(--milk); color:#ffffff; border:none;
    padding:15px; border-radius:14px; font-family:'Inter'; font-weight:700; font-size:15px;
    cursor:pointer;
  }
  .login-btn:disabled{ opacity:.6; }
  .login-error{
    color:#c0526a; font-size:12.5px; margin-top:12px; min-height:16px;
  }
  .logout-btn{
    position:absolute; top: calc(18px + env(safe-area-inset-top)); right:18px;
    background: var(--card); border:1px solid var(--line); color: var(--ink-faint);

const db = firebase.database();

let entries = [];
let selectedDiaper = 'none';
let currentView = 'today';

const $ = (id) => document.getElementById(id);

const MOON_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';
const SUN_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = $('theme-toggle-btn');
  if(btn) btn.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#0e1826' : '#f6f9fd');
  try{ localStorage.setItem('aylan-theme', theme); }catch(e){}
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

let initialTheme = 'light';
try{ initialTheme = localStorage.getItem('aylan-theme') || 'light'; }catch(e){}
applyTheme(initialTheme);

function pad(n){ return String(n).padStart(2,'0'); }

function nowTimeStr(){
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function setNow(){
  $('time-input').value = nowTimeStr();
}

function dateInputVal(dateObj){
  return dateObj.getFullYear()+'-'+pad(dateObj.getMonth()+1)+'-'+pad(dateObj.getDate());
}

function setDateOffset(daysAgo){
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  $('date-input').value = dateInputVal(d);
}

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

let entriesRef = null;
let profileRef = null;
let growthRef = null;
let profileData = null;
let growthEntries = [];

function startSync(){
  entriesRef = db.ref('entries');
  entriesRef.on('value', (snapshot) => {
    const val = snapshot.val();
    entries = val ? Object.values(val) : [];
    render();
  }, (err) => {
    showToast("Erreur de synchronisation");
  });

  profileRef = db.ref('profile');
  profileRef.on('value', (snapshot) => {
    profileData = snapshot.val() || null;
    renderProfileForm();
    renderAgeHero();
  });

  growthRef = db.ref('growth');
  growthRef.on('value', (snapshot) => {
    const val = snapshot.val();
    growthEntries = val ? Object.values(val) : [];
    renderGrowthList();
    renderGrowthCharts();
  });
}

function stopSync(){
  if(entriesRef) entriesRef.off();
  if(profileRef) profileRef.off();
  if(growthRef) growthRef.off();
  entries = [];
  profileData = null;
  growthEntries = [];
}

async function addEntryToDB(entry){
  try{
    await db.ref('entries/' + entry.id).set(entry);
  }catch(e){
    showToast("Erreur d'enregistrement");
  }
}

async function removeEntryFromDB(id){
  try{
    await db.ref('entries/' + id).remove();
  }catch(e){
    showToast("Erreur de suppression");
  }
}

function computeAge(birthDateStr){
  const [y,mo,d] = birthDateStr.split('-').map(Number);
  const birth = new Date(y, mo-1, d);
  const now = new Date();
  if(birth > now) return '—';

  let years = now.getFullYear() - birth.getFullYear();
  let months = now.getMonth() - birth.getMonth();
  let days = now.getDate() - birth.getDate();

  if(days < 0){
    months--;
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prevMonth.getDate();
  }
  if(months < 0){
    years--;
    months += 12;
  }

  if(years > 0) return `${years} an${years > 1 ? 's' : ''}${months > 0 ? ' et ' + months + ' mois' : ''}`;
  if(months > 0) return `${months} mois${days > 0 ? ' et ' + days + ' jour' + (days > 1 ? 's' : '') : ''}`;
  return `${days} jour${days > 1 ? 's' : ''}`;
}

function renderProfileForm(){
  if(!profileData) return;
  $('profile-firstname').value = profileData.firstName || '';
  $('profile-lastname').value = profileData.lastName || '';
  $('profile-birthdate').value = profileData.birthDate || '';
}

function renderAgeHero(){
  const hero = $('age-hero');
  if(profileData && profileData.birthDate){
    hero.classList.remove('hidden');
    $('age-name-lbl').textContent = profileData.firstName ? `Âge de ${profileData.firstName}` : 'Âge';
    $('age-value').textContent = computeAge(profileData.birthDate);
  }else{
    hero.classList.add('hidden');
  }
}

async function saveProfile(){
  const firstName = $('profile-firstname').value.trim();
  const lastName = $('profile-lastname').value.trim();
  const birthDate = $('profile-birthdate').value;

  if(!birthDate){
    showToast('Merci de renseigner la date de naissance');
    return;
  }

  try{
    await db.ref('profile').set({ firstName, lastName, birthDate });
    showToast('Informations enregistrées');
  }catch(e){
    showToast("Erreur d'enregistrement");
  }
}

function formatShortDate(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function formatShortDateNoYear(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}`;
}

function growthRowHtml(g){
  const parts = [];
  if(g.weight != null) parts.push(`${g.weight} kg`);
  if(g.height != null) parts.push(`${g.height} cm`);
  return `
    <div class="entry" data-id="${g.id}">
      <div class="node">·</div>
      <div class="entry-card">
        <div class="entry-main">
          <div class="entry-time">${formatShortDate(g.date)}</div>
          <div class="entry-details">
            <div class="entry-ml">${parts.join(' · ')}</div>
          </div>
        </div>
        <div class="entry-actions">
          <button class="entry-edit" data-gedit="${g.id}" aria-label="Modifier">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="entry-del" data-gdel="${g.id}">✕</button>
        </div>
      </div>
    </div>`;
}

function bindGrowthButtons(container){
  container.querySelectorAll('[data-gdel]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.classList.contains('confirming')){
        clearTimeout(btn._confirmTimeout);
        deleteGrowthEntry(btn.getAttribute('data-gdel'));
        return;
      }
      btn.classList.add('confirming');
      btn.textContent = 'Confirmer';
      btn._confirmTimeout = setTimeout(() => {
        btn.classList.remove('confirming');
        btn.textContent = '✕';
      }, 3000);
    });
  });
  container.querySelectorAll('[data-gedit]').forEach(btn => {
    btn.addEventListener('click', () => startEditGrowth(btn.getAttribute('data-gedit')));
  });
}

function renderGrowthList(){
  const container = $('growth-list');
  if(!growthEntries.length){
    container.innerHTML = `<div class="empty">Aucune mesure enregistrée pour l'instant.</div>`;
    return;
  }
  const sorted = [...growthEntries].sort((a,b) => b.date.localeCompare(a.date));
  container.innerHTML = `<div class="timeline">${sorted.map(growthRowHtml).join('')}</div>`;
  bindGrowthButtons(container);
}

function resetGrowthForm(){
  $('growth-date-input').value = dateInputVal(new Date());
  $('growth-weight-input').value = '';
  $('growth-height-input').value = '';
}

let editingGrowthId = null;

function startEditGrowth(id){
  const g = growthEntries.find(x => String(x.id) === String(id));
  if(!g) return;

  editingGrowthId = id;
  $('growth-date-input').value = g.date;
  $('growth-weight-input').value = g.weight != null ? g.weight : '';
  $('growth-height-input').value = g.height != null ? g.height : '';

  $('growth-form-title').textContent = 'Modifier cette mesure';

async function saveGrowthEntry(){

  const heightVal = $('growth-height-input').value;

  if(!weightVal && !heightVal){

    return;
  }

  const isEditing = editingGrowthId !== null;
  const entry = {
    id: isEditing ? editingGrowthId : Date.now(),
    date: dateVal,
    weight: weightVal ? parseFloat(weightVal) : null,
    height: heightVal ? parseFloat(heightVal) : null
  };

function renderSimpleLineChart(container, points, opts){
  if(!points.length){
    container.innerHTML = `<div class="chart-empty">Pas encore de mesure enregistrée.</div>`;
    return;
  }

  const n = points.length;
  const spacing = 56;
  const leftPad = 34, rightPad = 20, topPad = 24, bottomPad = 28, chartH = 120;
  const svgW = Math.max(260, leftPad + rightPad + (n - 1) * spacing);
  const svgH = topPad + chartH + bottomPad;

  const values = points.map(p => p.value);
  const minV = Math.min(...values);
  const maxV = Math.max(...values);
  const range = (maxV - minV) || 1;
  const padV = range * 0.2 || 1;
  const scaleMin = Math.max(0, minV - padV);
  const scaleMax = maxV + padV;

  const xFor = i => n > 1 ? leftPad + i * spacing : svgW / 2;
  const yFor = v => topPad + chartH - ((v - scaleMin) / (scaleMax - scaleMin)) * chartH;

  const gridLines = [0, 0.5, 1].map(f => {
    const val = scaleMin + (scaleMax - scaleMin) * f;
    const y = yFor(val);
    return `<line x1="${leftPad}" y1="${y}" x2="${svgW - rightPad}" y2="${y}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,4"/><text x="2" y="${y + 3.5}" font-size="9" fill="var(--ink-faint)" font-family="Inter">${val.toFixed(opts.decimals || 0)}</text>`;
  }).join('');

  const pathD = 'M ' + points.map((p,i) => `${xFor(i)},${yFor(p.value)}`).join(' L ');
  const areaD = n > 1 ? `${pathD} L ${xFor(n-1)},${topPad+chartH} L ${xFor(0)},${topPad+chartH} Z` : '';
  const dots = points.map((p,i) => `<circle cx="${xFor(i)}" cy="${yFor(p.value)}" r="3.5" fill="var(--milk)"/>`).join('');
  const labels = points.map((p,i) => `<text x="${xFor(i)}" y="${topPad + chartH + 20}" font-size="9" fill="var(--ink-faint)" font-family="Inter" text-anchor="middle">${p.label}</text>`).join('');
  const last = points[n-1];
  const lastLabel = `<text x="${xFor(n-1)}" y="${yFor(last.value) - 10}" font-size="10.5" font-weight="600" fill="var(--milk)" font-family="Inter" text-anchor="middle">${last.value}${opts.suffix || ''}</text>`;

  container.innerHTML = `
    <svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">
      ${gridLines}
      ${areaD ? `<path d="${areaD}" fill="var(--milk-dim)" opacity="0.6"/>` : ''}
      <path d="${pathD}" fill="none" stroke="var(--milk)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${lastLabel}
      ${labels}
    </svg>
  `;

  requestAnimationFrame(() => { container.scrollLeft = container.scrollWidth; });
}

function diaperLabel(val){
  return { none:'Couche sèche', pipi:'Pipi', caca:'Caca', both:'Pipi + caca' }[val] || '';
}
function diaperIcon(val){
  return { none:'·', pipi:'💧', caca:'●', both:'✦' }[val] || '·';
}

function todayKey(dateObj){
  return dateObj.getFullYear()+'-'+pad(dateObj.getMonth()+1)+'-'+pad(dateObj.getDate());
}

function formatDayLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  if(todayKey(date) === todayKey(today)) return "Aujourd'hui";
  if(todayKey(date) === todayKey(yest)) return "Hier";
  return date.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}

let tabAnimating = false;
const TAB_ORDER = ['today', 'calendar', 'chart', 'profile'];

function switchView(view){
  if(view === currentView || tabAnimating) return;
  tabAnimating = true;

  const oldView = currentView;
  const oldIndex = TAB_ORDER.indexOf(oldView);
  const newIndex = TAB_ORDER.indexOf(view);
  const direction = newIndex > oldIndex ? 1 : -1;

  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-view') === view);
  });

  const oldEl = $('view-' + oldView);
  const newEl = $('view-' + view);
  const outClass = direction === 1 ? 'tab-slide-out-l' : 'tab-slide-out-r';
  const inPrepClass = direction === 1 ? 'tab-slide-in-prep-l' : 'tab-slide-in-prep-r';

  oldEl.classList.add(outClass);

  setTimeout(() => {
    try{
      oldEl.classList.remove('active', outClass);
      currentView = view;

      newEl.classList.add(inPrepClass);
      newEl.classList.add('active');
      void newEl.offsetWidth;
      newEl.classList.remove(inPrepClass);

      if(view === 'calendar') renderCalendar();
      if(view === 'chart') renderChart();
      if(view === 'profile') renderGrowthCharts();
    }finally{
      setTimeout(() => { tabAnimating = false; }, 210);
    }
  }, 200);
}

function renderCalendar(){
  const year = calMonthDate.getFullYear();
  const month = calMonthDate.getMonth();

  $('cal-title').textContent = calMonthDate.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });

  const daysWithEntries = new Set(entries.map(e => e.dayKey));
  const firstOfMonth = new Date(year, month, 1);
  let startOffset = firstOfMonth.getDay() - 1; // lundi = 0
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = todayKey(new Date());

  const dowLabels = ['L','M','M','J','V','S','D'];
  let html = dowLabels.map(d => `<div class="cal-dow">${d}</div>`).join('');

  for(let i=0; i<startOffset; i++){
    html += `<div class="cal-day empty-cell"></div>`;
  }

  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const key = todayKey(dateObj);
    const has = daysWithEntries.has(key);
    const classes = ['cal-day'];
    if(has) classes.push('has-entries');
    if(key === todayStr) classes.push('is-today');
    if(key === selectedCalDay) classes.push('selected');
    html += `<div class="${classes.join(' ')}" data-day="${key}">${d}${has ? '<span class="dot"></span>' : ''}</div>`;
  }

  $('cal-grid').innerHTML = html;
  $('cal-grid').querySelectorAll('[data-day]').forEach(el => {
    el.addEventListener('click', () => {
      selectedCalDay = el.getAttribute('data-day');
      renderCalendar();
      renderCalDayDetail();
    });
  });

  if(selectedCalDay) renderCalDayDetail();
  else $('cal-day-detail').innerHTML = `<div class="empty">Sélectionnez un jour pour voir ses biberons.</div>`;
}

function renderCalDayDetail(){
  const container = $('cal-day-detail');
  const dayEntries = entries.filter(e => e.dayKey === selectedCalDay).sort((a,b)=> a.timestamp - b.timestamp);
  const label = formatDayLabel(selectedCalDay);

  if(!dayEntries.length){
    container.innerHTML = `<div class="cal-day-detail-label">${label}</div><div class="empty">Aucun biberon ce jour-là.</div>`;
    return;
  }

  const totalMl = dayEntries.reduce((s,e)=> s + (e.ml||0), 0);
  container.innerHTML = `
    <div class="cal-day-detail-label">${label} · ${dayEntries.length} biberon${dayEntries.length>1?'s':''} · ${totalMl} ml</div>
    <div class="timeline">${dayEntries.map(entryRowHtml).join('')}</div>
  `;
  bindEntryButtons(container);
}

function addDays(date, n){
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function renderChart(){
  const scroll = $('chart-scroll');

  if(!entries.length){
    scroll.innerHTML = `<div class="chart-empty">Pas encore de données à afficher.<br>Ajoute quelques biberons pour voir la courbe.</div>`;
    $('chart-stats').innerHTML = '';
    return;
  }

  const totalsMap = {};
  entries.forEach(e => {
    totalsMap[e.dayKey] = (totalsMap[e.dayKey] || 0) + (e.ml || 0);
  });

  const keys = Object.keys(totalsMap).sort();
  const [sy, smo, sd] = keys[0].split('-').map(Number);
  const startDate = new Date(sy, smo - 1, sd);
  const todayDate = new Date();
  const todayStr = todayKey(todayDate);
  const lastKey = keys[keys.length - 1] > todayStr ? keys[keys.length - 1] : todayStr;
  const [ey, emo, ed] = lastKey.split('-').map(Number);
  const endDate = new Date(ey, emo - 1, ed);

  const days = [];
  let cursor = new Date(startDate);
  while(cursor <= endDate){
    const k = todayKey(cursor);
    days.push({ dayKey: k, total: totalsMap[k] || 0, date: new Date(cursor) });
    cursor = addDays(cursor, 1);
  }

  const n = days.length;
  const spacing = 46;
  const leftPad = 32;
  const rightPad = 20;
  const topPad = 24;
  const bottomPad = 28;
  const chartH = 140;
  const svgW = Math.max(320, leftPad + rightPad + (n - 1) * spacing);
  const svgH = topPad + chartH + bottomPad;

  const maxVal = Math.max(...days.map(d => d.total), 1);
  const niceMax = Math.ceil(maxVal / 50) * 50 || 50;

  const xFor = i => leftPad + i * spacing;
  const yFor = v => topPad + chartH - (v / niceMax) * chartH;

  const gridLines = [0, 0.5, 1].map(f => {
    const val = Math.round(niceMax * f);
    const y = yFor(val);
    return `<line x1="${leftPad}" y1="${y}" x2="${svgW - rightPad}" y2="${y}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,4"/><text x="2" y="${y + 3.5}" font-size="9" fill="var(--ink-faint)" font-family="Inter">${val}</text>`;
  }).join('');

  const pathD = 'M ' + days.map((d,i) => `${xFor(i)},${yFor(d.total)}`).join(' L ');
  const areaD = `${pathD} L ${xFor(n-1)},${topPad+chartH} L ${xFor(0)},${topPad+chartH} Z`;

  const labelInterval = Math.max(1, Math.ceil(n / 9));
  const xLabels = days.map((d,i) => {
    if(i % labelInterval !== 0 && i !== n - 1) return '';
    const short = `${pad(d.date.getDate())}/${pad(d.date.getMonth()+1)}`;
    return `<text x="${xFor(i)}" y="${topPad + chartH + 20}" font-size="9.5" fill="var(--ink-faint)" font-family="Inter" text-anchor="middle">${short}</text>`;
  }).join('');

  const dots = days.map((d,i) => {
    const isToday = d.dayKey === todayStr;
    const r = isToday ? 4.5 : 3;
    const ring = isToday ? `stroke="var(--sage)" stroke-width="2"` : '';
    return `<circle cx="${xFor(i)}" cy="${yFor(d.total)}" r="${r}" fill="var(--milk)" ${ring}/>`;
  }).join('');

  const todayIdx = days.findIndex(d => d.dayKey === todayStr);
  let todayLabel = '';
  if(todayIdx >= 0){
    const d = days[todayIdx];
    todayLabel = `<text x="${xFor(todayIdx)}" y="${yFor(d.total) - 10}" font-size="10.5" font-weight="600" fill="var(--milk)" font-family="Inter" text-anchor="middle">${d.total}</text>`;
  }

  scroll.innerHTML = `
    <svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">
      ${gridLines}
      <path d="${areaD}" fill="var(--milk-dim)" opacity="0.6"/>
      <path d="${pathD}" fill="none" stroke="var(--milk)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${todayLabel}
      ${xLabels}
    </svg>
  `;

  requestAnimationFrame(() => { scroll.scrollLeft = scroll.scrollWidth; });

  const avg = Math.round(days.reduce((s,d) => s + d.total, 0) / n);
  const max = Math.max(...days.map(d => d.total));
  $('chart-stats').innerHTML = `
    <div class="stat"><div class="num">${avg} ml</div><div class="lbl">Moyenne / jour</div></div>
    <div class="stat"><div class="num">${max} ml</div><div class="lbl">Record</div></div>
    <div class="stat"><div class="num">${n}</div><div class="lbl">Jours suivis</div></div>
  `;
}

async function saveEntry(){
  const timeVal = $('time-input').value || nowTimeStr();
  const dateVal = $('date-input').value || dateInputVal(new Date());
  const ml = parseInt($('ml-input').value, 10) || 0;
  const [h,m] = timeVal.split(':').map(Number);
  const [y,mo,d] = dateVal.split('-').map(Number);

  const entryDate = new Date(y, mo-1, d, h, m);
  const isEditing = editingId !== null;
  const currentEmail = auth.currentUser ? auth.currentUser.email : null;

  const entry = {
    id: isEditing ? editingId : Date.now(),
    time: timeVal,
    ml: ml,
    diaper: selectedDiaper,
    timestamp: entryDate.getTime(),
    dayKey: dateVal,
    authorEmail: isEditing ? (editingOriginalAuthor || currentEmail) : currentEmail
  };

  await addEntryToDB(entry);
  showToast(isEditing ? 'Biberon modifié' : (entry.dayKey === todayKey(new Date()) ? 'Biberon enregistré' : `Biberon ajouté pour le ${formatDayLabel(entry.dayKey)}`));

  if(isEditing){
    cancelEdit();
  }else{
    selectDiaper('none');
    setDateOffset(0);
    setNow();
  }
}

let calAnimating = false;

function goToMonth(direction){
  if(calAnimating) return;
  calAnimating = true;

  try{
    const grid = $('cal-grid');
    const title = $('cal-title');
    const outClass = direction === 1 ? 'slide-out-l' : 'slide-out-r';
    const inPrepClass = direction === 1 ? 'slide-in-prep-l' : 'slide-in-prep-r';

    title.style.opacity = '0';
    grid.classList.add(outClass);

    setTimeout(() => {
      try{
        calMonthDate = new Date(calMonthDate.getFullYear(), calMonthDate.getMonth() + direction, 1);
        renderCalendar();

        const newGrid = $('cal-grid');
        newGrid.classList.remove(outClass);
        newGrid.classList.add(inPrepClass);
        void newGrid.offsetWidth;
        newGrid.classList.remove(inPrepClass);
        $('cal-title').style.opacity = '1';
      }finally{
        setTimeout(() => { calAnimating = false; }, 220);
      }
    }, 220);
  }catch(e){
    calAnimating = false;
  }
}

$('cal-prev').addEventListener('click', () => goToMonth(-1));
$('cal-next').addEventListener('click', () => goToMonth(1));

let swipeStartX = null;
let swipeStartY = null;
const swipeZone = $('view-calendar');
swipeZone.addEventListener('touchstart', (e) => {
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
}, { passive: true });
swipeZone.addEventListener('touchend', (e) => {
  if(swipeStartX === null) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  swipeStartX = null;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
    goToMonth(dx < 0 ? 1 : -1);
  }
});

document.querySelectorAll('.diaper-btn').forEach(btn => {
  btn.addEventListener('click', () => selectDiaper(btn.getAttribute('data-val')));
});

document.querySelectorAll('#quick-ml button').forEach(btn => {
  btn.addEventListener('click', () => {
    $('ml-input').value = btn.getAttribute('data-ml');
  });
});

$('ml-minus').addEventListener('click', () => {
  const cur = parseInt($('ml-input').value,10) || 0;
  $('ml-input').value = Math.max(0, cur - 10);
});
$('ml-plus').addEventListener('click', () => {
  const cur = parseInt($('ml-input').value,10) || 0;
  $('ml-input').value = cur + 10;
});

$('login-btn').addEventListener('click', doLogin);
$('login-password').addEventListener('keydown', (e) => { if(e.key === 'Enter') doLogin(); });
$('logout-btn').addEventListener('click', doLogout);
$('theme-toggle-btn').addEventListener('click', toggleTheme);

$('fab-btn').addEventListener('click', () => {
  if(editingId !== null) cancelEdit();
  const wasOnToday = currentView === 'today';
  switchView('today');
  setTimeout(() => {
    $('view-today').scrollIntoView({ behavior: 'smooth', block: 'start' });
    const card = document.querySelector('#view-today .card');
    if(card){
      card.style.boxShadow = '0 0 0 2px var(--milk)';
      setTimeout(() => { card.style.boxShadow = ''; }, 700);
    }
  }, wasOnToday ? 0 : 430);
});

$('same-as-last-btn').addEventListener('click', () => {
  if(!entries.length){
    showToast('Aucun biberon précédent trouvé');
    return;
  }
  const last = [...entries].sort((a,b) => b.timestamp - a.timestamp)[0];
  $('ml-input').value = last.ml;
  selectDiaper(last.diaper);
  showToast('Quantité et couche reprises');
});

$('import-toggle').addEventListener('click', () => {
  $('import-box').classList.toggle('hidden');
});

$('import-btn').addEventListener('click', async () => {
  const resultEl = $('import-result');
  resultEl.textContent = '';
  let list;
  try{
    list = JSON.parse($('import-textarea').value);
    if(!Array.isArray(list)) throw new Error('not an array');
  }catch(e){
    resultEl.textContent = 'Format invalide : vérifie le JSON collé.';
    return;
  }

  const updates = {};
  let count = 0;
  list.forEach((item, i) => {
    if(!item.date || !item.time) return;
    const [y, mo, d] = item.date.split('-').map(Number);
    const [h, mi] = item.time.split(':').map(Number);
    if(!y || !mo || !d || isNaN(h) || isNaN(mi)) return;
    const entryDate = new Date(y, mo - 1, d, h, mi);
    const id = 'imp_' + Date.now() + '_' + i;
    updates[id] = {
      id: id,
      time: pad(h) + ':' + pad(mi),
      ml: Number(item.ml) || 0,
      diaper: item.diaper || 'none',
      timestamp: entryDate.getTime(),
      dayKey: item.date
    };
    count++;
  });

  if(!count){
    resultEl.textContent = 'Aucune entrée valide trouvée.';
    return;
  }

  try{
    await db.ref('entries').update(updates);
    resultEl.textContent = `${count} biberon${count > 1 ? 's' : ''} importé${count > 1 ? 's' : ''} avec succès.`;
    showToast(`${count} biberons importés`);
  }catch(e){
    resultEl.textContent = "Erreur lors de l'import.";
  }
});

selectDiaper('none');
setDateOffset(0);
setNow();
$('growth-date-input').value = dateInputVal(new Date());

setInterval(() => {
  if(auth.currentUser){
    renderStats();
    renderAgeHero();
  }
}, 30000);

document.addEventListener('visibilitychange', () => {
  if(!document.hidden && auth.currentUser){
    renderStats();
    renderAgeHero();
  }
});
</script>
</body>
</html>
