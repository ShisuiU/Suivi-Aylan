<style>
  :root{
    --bg: #f6f9fd;
    --bg-2: #eaf1fa;
    --card: #ffffff;
    --card-hover: #eef4fb;
    --ink: #1e3a5c;
    --ink-dim: #5c7796;
    --ink-faint: #9db1c9;
    --milk: #4576ab;
    --milk-dim: #dce8f6;
    --diaper: #7fa5c9;
    --diaper-dim: #e9f0f8;
    --sage: #7fa5c9;
    --line: #e2eaf3;
    --radius: 18px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #e4eefb 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }
  .wrap{
    max-width: 560px; margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
  }

  header{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom: 26px; }
  header h1{
    font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic;
    font-size: 44px; margin:0; letter-spacing: 0.01em; color: var(--ink);
  }
  header h1 .dot{ color: var(--milk); }
  header .subtitle{
    font-size: 11px; color: var(--ink-faint); margin-top: 4px;
    text-transform: uppercase; letter-spacing: .14em;
  }

  .stats{
    display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:22px;
  }
  .stat{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px 10px; text-align:center;
  }
  .stat .num{ font-family:'Fraunces', serif; font-size: 22px; font-weight:600; }
  .stat .lbl{ font-size: 10.5px; color: var(--ink-faint); margin-top:2px; text-transform:uppercase; letter-spacing:.06em; }

  .card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px;
  }
  .card h2{
    font-family:'Fraunces', serif; font-size:16px; font-weight:600; margin:0 0 14px 0;
    color: var(--ink);
  }

  label.field-label{
    display:block; font-size:11.5px; color: var(--ink-faint); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:8px; margin-top:16px;
  }
  label.field-label:first-child{ margin-top:0; }

  .time-row{ display:flex; gap:10px; align-items:center; }
  input[type="time"], input[type="date"]{
    flex:1; background: var(--bg-2); border:1px solid var(--line); color: var(--ink);
    font-family:'Inter'; font-size:17px; font-weight:500; padding:14px 16px; border-radius:12px;
  }
  input[type="date"]{ width:100%; }
  .now-btn{
    background: var(--bg-2); border:1px solid var(--line); color: var(--ink-dim);
    width:50px; height:50px; border-radius:12px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .now-btn:active{ background: var(--card-hover); }

  .ml-row{ display:flex; align-items:center; gap:12px; }
  .ml-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
    background: var(--bg-2); color: var(--ink); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .ml-btn:active{ background: var(--milk-dim); }
  .ml-input-wrap{
    flex:1; display:flex; align-items:baseline; justify-content:center; gap:6px;
    background: var(--bg-2); border:1px solid var(--line); border-radius:12px; padding: 10px 8px;
  }
  input#ml-input{
    width: 90px; background:transparent; border:none; color:var(--milk);
    font-family:'Fraunces', serif; font-size: 28px; font-weight:600; text-align:right;
    outline:none; min-width:0;
  }
  .ml-unit{ color: var(--ink-faint); font-size:14px; }

  .quick-ml{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .quick-ml button{
    background: var(--bg-2); border:1px solid var(--line); color: var(--ink-dim);
    padding: 7px 12px; border-radius: 20px; font-size:12.5px; cursor:pointer; font-family:'Inter';
  }
  .quick-ml button.active{ background: var(--milk-dim); color: var(--milk); border-color: var(--milk-dim); }

  .diaper-row{ display:grid; grid-template-columns: repeat(4,1fr); gap:8px; }
  .diaper-btn{
    background: var(--bg-2); border:1px solid var(--line); color: var(--ink-dim);
    padding: 12px 4px; border-radius:12px; cursor:pointer; font-family:'Inter'; font-size:12px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .diaper-btn .ic{ font-size:18px; }
  .diaper-btn.active{ background: var(--diaper-dim); color: var(--diaper); border-color: var(--diaper-dim); }

  .save-btn{
    width:100%; margin-top:20px; background: var(--milk); color: #ffffff;
    border:none; padding:15px; border-radius:14px; font-family:'Inter'; font-weight:700;
    font-size:15px; cursor:pointer; letter-spacing:.01em;
  }
  .save-btn:active{ transform: scale(0.99); }

  /* Timeline */
  .day-label{
    font-size:12px; color: var(--ink-faint); text-transform:uppercase; letter-spacing:.08em;
    margin: 26px 0 12px 4px;
  }
  .timeline{ position:relative; padding-left: 26px; }
  .timeline::before{
    content:''; position:absolute; left:9px; top:6px; bottom:6px; width:1.5px;
    background: var(--line);
  }
  .entry{ position:relative; margin-bottom: 16px; }
  .entry .node{
    position:absolute; left:-26px; top:2px; width:18px; height:18px; border-radius:50%;
    background: var(--milk-dim); border: 2px solid var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  .entry-card{
    background: var(--card); border:1px solid var(--line); border-radius:14px;
    padding: 12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .entry-main{ display:flex; align-items:center; gap:12px; }
  .entry-time{ font-family:'Fraunces', serif; font-size:15px; color: var(--ink); min-width:44px; }
  .entry-details{ display:flex; flex-direction:column; gap:2px; }
  .entry-ml{ font-size:14px; color: var(--milk); font-weight:600; }
  .entry-diaper{ font-size:11.5px; color: var(--ink-faint); }
  .entry-del{
    background:none; border:none; color: var(--ink-faint); font-size:16px; cursor:pointer;
    padding:6px;
  }
  .entry-del:active{ color: var(--diaper); }

  .empty{
    text-align:center; color: var(--ink-faint); font-size:13px; padding: 30px 10px;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--card); border:1px solid var(--line); color: var(--ink);
    padding:12px 20px; border-radius:30px; font-size:13px; opacity:0; pointer-events:none;
    transition: all .25s ease; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Tabs */
  .tabs{
    display:flex; gap:6px; background: var(--card); border:1px solid var(--line);
    border-radius:14px; padding:4px; margin-bottom:22px;
  }
  .tab-btn{
    flex:1; background:none; border:none; color: var(--ink-faint); font-family:'Inter';
    font-size:13.5px; font-weight:600; padding:10px 8px; border-radius:10px; cursor:pointer;
  }
  .tab-btn.active{ background: var(--bg-2); color: var(--ink); }
  .view{ display:none; }
  .view.active{ display:block; }

  /* Calendar */
  .cal-nav{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
  }
  .cal-nav-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background: var(--card); color: var(--ink); font-size:16px; cursor:pointer;
  }
  .cal-nav-title{
    font-family:'Fraunces', serif; font-size:17px; font-weight:600; text-transform:capitalize;
  }
  .cal-grid{
    display:grid; grid-template-columns: repeat(7,1fr); gap:6px; margin-bottom:22px;
    touch-action: pan-y;
    transition: transform .22s ease, opacity .22s ease;
  }
  .cal-grid.slide-out-l{ transform: translateX(-24px); opacity:0; }
  .cal-grid.slide-out-r{ transform: translateX(24px); opacity:0; }
  .cal-grid.slide-in-prep-l{ transition:none; transform: translateX(24px); opacity:0; }
  .cal-grid.slide-in-prep-r{ transition:none; transform: translateX(-24px); opacity:0; }
  .cal-nav-title{ transition: opacity .18s ease; }
  .cal-dow{
    text-align:center; font-size:10.5px; color: var(--ink-faint); text-transform:uppercase;
    padding-bottom:4px;
  }
  .cal-day{
    aspect-ratio:1; border-radius:10px; border:1px solid transparent; background: var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; font-size:13px; color: var(--ink-dim); gap:3px; position:relative;
  }
  .cal-day.empty-cell{ background:none; cursor:default; }
  .cal-day.has-entries{ color: var(--ink); }
  .cal-day .dot{
    width:5px; height:5px; border-radius:50%; background: var(--milk);
  }
  .cal-day.selected{ border-color: var(--milk); background: var(--milk-dim); color: var(--ink); }
  .cal-day.is-today{ box-shadow: inset 0 0 0 1px var(--sage); }

  .cal-day-detail-label{
    font-family:'Fraunces', serif; font-size:16px; font-weight:600; margin: 4px 0 12px 2px;
  }

  /* Login */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    width:100%; max-width:340px; background: var(--card); border:1px solid var(--line);
    border-radius: var(--radius); padding: 32px 26px; text-align:center;
  }
  .login-title{
    font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic;
    font-size: 40px; margin:0 0 2px 0; color: var(--ink);
  }
  .login-sub{
    font-size: 11px; color: var(--ink-faint); text-transform:uppercase; letter-spacing:.14em;
    margin: 0 0 26px 0;
  }
  .login-field{
    width:100%; background: var(--bg-2); border:1px solid var(--line); color: var(--ink);
    font-family:'Inter'; font-size:16px; padding:14px 16px; border-radius:12px;
    margin-bottom:10px; text-align:left;
  }
  .login-btn{
    width:100%; margin-top:10px; background: var(--milk); color:#ffffff; border:none;
    padding:15px; border-radius:14px; font-family:'Inter'; font-weight:700; font-size:15px;
    cursor:pointer;
  }
  .login-btn:disabled{ opacity:.6; }
  .login-error{
    color:#c0526a; font-size:12.5px; margin-top:12px; min-height:16px;
  }
  .logout-btn{
    position:absolute; top: calc(18px + env(safe-area-inset-top)); right:18px;
    background: var(--card); border:1px solid var(--line); color: var(--ink-faint);
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  header{ position:relative; }
  .hidden{ display:none !important; }

  /* Import */
  .import-toggle{
    background:none; border:none; color: var(--ink-faint); font-size:12px;
    font-family:'Inter'; text-decoration:underline; cursor:pointer; padding:18px 4px 4px;
    display:block;
  }
  .import-box{ margin-top:10px; }
  .import-box textarea{
    width:100%; min-height:140px; background: var(--bg-2); border:1px solid var(--line);
    color: var(--ink); font-family:monospace; font-size:11.5px; border-radius:12px;
    padding:12px; box-sizing:border-box; resize:vertical;
  }
  .import-result{ font-size:12px; color: var(--ink-faint); margin-top:8px; }
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <h1 class="login-title">Aylan</h1>
    <div class="login-sub">Connexion</div>
    <input class="login-field" type="email" id="login-email" placeholder="Email" autocomplete="username">
    <input class="login-field" type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="login-btn" id="login-btn">Se connecter</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="wrap hidden" id="app-wrap">
  <button class="logout-btn" id="logout-btn" aria-label="Se déconnecter" title="Se déconnecter">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
  </button>
  <header>
    <div>
      <h1>Aylan</h1>
      <div class="subtitle">biberons &amp; couches</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-view="today">Aujourd'hui</button>
    <button class="tab-btn" data-view="calendar">Calendrier</button>
  </div>

  <div class="view active" id="view-today">
    <div class="stats" id="stats"></div>

    <div class="card">
      <h2>Ajout d'un biberon</h2>

      <label class="field-label">Jour</label>
      <div class="time-row">
        <input type="date" id="date-input">
      </div>

      <label class="field-label">Heure</label>
      <div class="time-row">
        <input type="time" id="time-input">
        <button class="now-btn" id="now-btn" type="button" aria-label="Régler à maintenant">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        </button>
      </div>

      <label class="field-label">Couche juste avant</label>
      <div class="diaper-row" id="diaper-row">
        <button class="diaper-btn" data-val="none"><span class="ic">·</span>Rien</button>
        <button class="diaper-btn" data-val="pipi"><span class="ic">💧</span>Pipi</button>
        <button class="diaper-btn" data-val="caca"><span class="ic">●</span>Caca</button>
        <button class="diaper-btn" data-val="both"><span class="ic">✦</span>Les deux</button>
      </div>

      <label class="field-label">Quantité de lait</label>
      <div class="ml-row">
        <button class="ml-btn" id="ml-minus" type="button">–</button>
        <div class="ml-input-wrap">
          <input type="number" id="ml-input" value="90" min="0" step="10">
          <span class="ml-unit">ml</span>
        </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDS7SatJhkAhqAxjAa-1n2MzLWHHSTpoN4",
  authDomain: "suivi-aylan.firebaseapp.com",
  databaseURL: "https://suivi-aylan-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "suivi-aylan",
  storageBucket: "suivi-aylan.firebasestorage.app",
  messagingSenderId: "999972029793",
  appId: "1:999972029793:web:06d7eb37bfb78fa4a6f120"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let entries = [];
let selectedDiaper = 'none';
let currentView = 'today';
let calMonthDate = new Date();
let selectedCalDay = null;

const $ = (id) => document.getElementById(id);

function pad(n){ return String(n).padStart(2,'0'); }

function nowTimeStr(){
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function setNow(){
  $('time-input').value = nowTimeStr();
}

function dateInputVal(dateObj){
  return dateObj.getFullYear()+'-'+pad(dateObj.getMonth()+1)+'-'+pad(dateObj.getDate());
}

function setDateOffset(daysAgo){
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  $('date-input').value = dateInputVal(d);
}

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

let entriesRef = null;

function startSync(){
  entriesRef = db.ref('entries');
  entriesRef.on('value', (snapshot) => {
    const val = snapshot.val();
    entries = val ? Object.values(val) : [];
    render();
  }, (err) => {
    showToast("Erreur de synchronisation");
  });
}

function stopSync(){
  if(entriesRef) entriesRef.off();
  entries = [];
}

async function addEntryToDB(entry){
  try{
    await db.ref('entries/' + entry.id).set(entry);
  }catch(e){
    showToast("Erreur d'enregistrement");
  }
}

async function removeEntryFromDB(id){
  try{
    await db.ref('entries/' + id).remove();
  }catch(e){
    showToast("Erreur de suppression");
  }
}

async function doLogin(){
  const email = $('login-email').value.trim();
  const password = $('login-password').value;
  const btn = $('login-btn');
  const errEl = $('login-error');
  errEl.textContent = '';

  if(!email || !password){
    errEl.textContent = 'Merci de remplir les deux champs.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Connexion...';
  try{
    await auth.signInWithEmailAndPassword(email, password);
  }catch(e){
    errEl.textContent = 'Email ou mot de passe incorrect.';
  }
  btn.disabled = false;
  btn.textContent = 'Se connecter';
}

function doLogout(){
  auth.signOut();
}

auth.onAuthStateChanged((user) => {
  if(user){
    $('login-screen').classList.add('hidden');
    $('app-wrap').classList.remove('hidden');
    startSync();
  }else{
    $('app-wrap').classList.add('hidden');
    $('login-screen').classList.remove('hidden');
    stopSync();
  }
});

function diaperLabel(val){
  return { none:'Couche sèche', pipi:'Pipi', caca:'Caca', both:'Pipi + caca' }[val] || '';
}
function diaperIcon(val){
  return { none:'·', pipi:'💧', caca:'●', both:'✦' }[val] || '·';
}

function todayKey(dateObj){
  return dateObj.getFullYear()+'-'+pad(dateObj.getMonth()+1)+'-'+pad(dateObj.getDate());
}

function formatDayLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  if(todayKey(date) === todayKey(today)) return "Aujourd'hui";
  if(todayKey(date) === todayKey(yest)) return "Hier";
  return date.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}

function switchView(view){
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-view') === view);
  });
  $('view-today').classList.toggle('active', view === 'today');
  $('view-calendar').classList.toggle('active', view === 'calendar');
  if(view === 'calendar') renderCalendar();
}

function render(){
  renderStats();
  renderTodayTimeline();
  if(currentView === 'calendar') renderCalendar();
}

function renderStats(){
  const today = todayKey(new Date());
  const todays = entries.filter(e => e.dayKey === today);
  const totalMl = todays.reduce((s,e)=> s + (e.ml||0), 0);
  const feedCount = todays.length;
  const diaperCount = todays.filter(e => e.diaper !== 'none').length;

  let lastAgo = '—';
  if(entries.length){
    const sorted = [...entries].sort((a,b)=> b.timestamp - a.timestamp);
    const diffMin = Math.round((Date.now() - sorted[0].timestamp) / 60000);
    if(diffMin < 60) lastAgo = diffMin + ' min';
    else lastAgo = Math.floor(diffMin/60) + ' h ' + (diffMin%60) + ' min';
  }

  $('stats').innerHTML = `
    <div class="stat"><div class="num">${lastAgo}</div><div class="lbl">Dernier biberon</div></div>
    <div class="stat"><div class="num">${totalMl} ml</div><div class="lbl">Aujourd'hui</div></div>
    <div class="stat"><div class="num">${feedCount} / ${diaperCount}</div><div class="lbl">Bib. / Couches</div></div>
  `;
}

function entryRowHtml(e){
  return `
    <div class="entry" data-id="${e.id}">
      <div class="node">${diaperIcon(e.diaper)}</div>
      <div class="entry-card">
        <div class="entry-main">
          <div class="entry-time">${e.time}</div>
          <div class="entry-details">
            <div class="entry-ml">${e.ml} ml</div>
            <div class="entry-diaper">${diaperLabel(e.diaper)}</div>
          </div>
        </div>
        <button class="entry-del" data-del="${e.id}">✕</button>
      </div>
    </div>`;
}

function bindDeleteButtons(container){
  container.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => deleteEntry(btn.getAttribute('data-del')));
  });
}

function renderTodayTimeline(){
  const container = $('timeline-container');
  const today = todayKey(new Date());
  const todays = entries.filter(e => e.dayKey === today).sort((a,b)=> b.timestamp - a.timestamp);

  if(!todays.length){
    container.innerHTML = `<div class="empty">Aucun biberon aujourd'hui pour le moment.<br>Ajoutez le premier ci-dessus.</div>`;
    return;
  }

  container.innerHTML = `<div class="timeline">${todays.map(entryRowHtml).join('')}</div>`;
  bindDeleteButtons(container);
}

function renderCalendar(){
  const year = calMonthDate.getFullYear();
  const month = calMonthDate.getMonth();

  $('cal-title').textContent = calMonthDate.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });

  const daysWithEntries = new Set(entries.map(e => e.dayKey));
  const firstOfMonth = new Date(year, month, 1);
  let startOffset = firstOfMonth.getDay() - 1; // lundi = 0
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = todayKey(new Date());

  const dowLabels = ['L','M','M','J','V','S','D'];
  let html = dowLabels.map(d => `<div class="cal-dow">${d}</div>`).join('');

  for(let i=0; i<startOffset; i++){
    html += `<div class="cal-day empty-cell"></div>`;
  }

  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const key = todayKey(dateObj);
    const has = daysWithEntries.has(key);
    const classes = ['cal-day'];
    if(has) classes.push('has-entries');
    if(key === todayStr) classes.push('is-today');
    if(key === selectedCalDay) classes.push('selected');
    html += `<div class="${classes.join(' ')}" data-day="${key}">${d}${has ? '<span class="dot"></span>' : ''}</div>`;
  }

  $('cal-grid').innerHTML = html;
  $('cal-grid').querySelectorAll('[data-day]').forEach(el => {
    el.addEventListener('click', () => {
      selectedCalDay = el.getAttribute('data-day');
      renderCalendar();
      renderCalDayDetail();
    });
  });

  if(selectedCalDay) renderCalDayDetail();
  else $('cal-day-detail').innerHTML = `<div class="empty">Sélectionnez un jour pour voir ses biberons.</div>`;
}

function renderCalDayDetail(){
  const container = $('cal-day-detail');
  const dayEntries = entries.filter(e => e.dayKey === selectedCalDay).sort((a,b)=> b.timestamp - a.timestamp);
  const label = formatDayLabel(selectedCalDay);

  if(!dayEntries.length){
    container.innerHTML = `<div class="cal-day-detail-label">${label}</div><div class="empty">Aucun biberon ce jour-là.</div>`;
    return;
  }

  const totalMl = dayEntries.reduce((s,e)=> s + (e.ml||0), 0);
  container.innerHTML = `
    <div class="cal-day-detail-label">${label} · ${dayEntries.length} biberon${dayEntries.length>1?'s':''} · ${totalMl} ml</div>
    <div class="timeline">${dayEntries.map(entryRowHtml).join('')}</div>
  `;
  bindDeleteButtons(container);
}

async function deleteEntry(id){
  await removeEntryFromDB(id);
  showToast('Entrée supprimée');
}

function selectDiaper(val){
  selectedDiaper = val;
  document.querySelectorAll('.diaper-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-val') === val);
  });
}

async function saveEntry(){
  const timeVal = $('time-input').value || nowTimeStr();
  const dateVal = $('date-input').value || dateInputVal(new Date());
  const ml = parseInt($('ml-input').value, 10) || 0;
  const [h,m] = timeVal.split(':').map(Number);
  const [y,mo,d] = dateVal.split('-').map(Number);

  const entryDate = new Date(y, mo-1, d, h, m);

  const entry = {
    id: Date.now(),
    time: timeVal,
    ml: ml,
    diaper: selectedDiaper,
    timestamp: entryDate.getTime(),
    dayKey: todayKey(entryDate)
  };

  await addEntryToDB(entry);
  showToast(entry.dayKey === todayKey(new Date()) ? 'Biberon enregistré' : `Biberon ajouté pour le ${formatDayLabel(entry.dayKey)}`);

  selectDiaper('none');
  setDateOffset(0);
  setNow();
}

// init
$('now-btn').addEventListener('click', setNow);
$('save-btn').addEventListener('click', saveEntry);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.getAttribute('data-view')));
});

let calAnimating = false;

function goToMonth(direction){
  if(calAnimating) return;
  calAnimating = true;

  try{
    const grid = $('cal-grid');
    const title = $('cal-title');
    const outClass = direction === 1 ? 'slide-out-l' : 'slide-out-r';
    const inPrepClass = direction === 1 ? 'slide-in-prep-l' : 'slide-in-prep-r';

    title.style.opacity = '0';
    grid.classList.add(outClass);

    setTimeout(() => {
      try{
        calMonthDate = new Date(calMonthDate.getFullYear(), calMonthDate.getMonth() + direction, 1);
        renderCalendar();

        const newGrid = $('cal-grid');
        newGrid.classList.remove(outClass);
        newGrid.classList.add(inPrepClass);
        void newGrid.offsetWidth;
        newGrid.classList.remove(inPrepClass);
        $('cal-title').style.opacity = '1';
      }finally{
        setTimeout(() => { calAnimating = false; }, 220);
      }
    }, 220);
  }catch(e){
    calAnimating = false;
  }
}

$('cal-prev').addEventListener('click', () => goToMonth(-1));
$('cal-next').addEventListener('click', () => goToMonth(1));

let swipeStartX = null;
let swipeStartY = null;
const swipeZone = $('view-calendar');
swipeZone.addEventListener('touchstart', (e) => {
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
}, { passive: true });
swipeZone.addEventListener('touchend', (e) => {
  if(swipeStartX === null) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  swipeStartX = null;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
    goToMonth(dx < 0 ? 1 : -1);
  }
});

document.querySelectorAll('.diaper-btn').forEach(btn => {
  btn.addEventListener('click', () => selectDiaper(btn.getAttribute('data-val')));
});

document.querySelectorAll('#quick-ml button').forEach(btn => {
  btn.addEventListener('click', () => {
    $('ml-input').value = btn.getAttribute('data-ml');
  });
});

$('ml-minus').addEventListener('click', () => {
  const cur = parseInt($('ml-input').value,10) || 0;
  $('ml-input').value = Math.max(0, cur - 10);
});
$('ml-plus').addEventListener('click', () => {
  const cur = parseInt($('ml-input').value,10) || 0;
  $('ml-input').value = cur + 10;
});

$('login-btn').addEventListener('click', doLogin);
$('login-password').addEventListener('keydown', (e) => { if(e.key === 'Enter') doLogin(); });
$('logout-btn').addEventListener('click', doLogout);

$('import-toggle').addEventListener('click', () => {
  $('import-box').classList.toggle('hidden');
});

$('import-btn').addEventListener('click', async () => {
  const resultEl = $('import-result');
  resultEl.textContent = '';
  let list;
  try{
    list = JSON.parse($('import-textarea').value);
    if(!Array.isArray(list)) throw new Error('not an array');
  }catch(e){
    resultEl.textContent = 'Format invalide : vérifie le JSON collé.';
    return;
  }

  const updates = {};
  let count = 0;
  list.forEach((item, i) => {
    if(!item.date || !item.time) return;
    const [y, mo, d] = item.date.split('-').map(Number);
    const [h, mi] = item.time.split(':').map(Number);
    if(!y || !mo || !d || isNaN(h) || isNaN(mi)) return;
    const entryDate = new Date(y, mo - 1, d, h, mi);
    const id = 'imp_' + Date.now() + '_' + i;
    updates[id] = {
      id: id,
      time: pad(h) + ':' + pad(mi),
      ml: Number(item.ml) || 0,
      diaper: item.diaper || 'none',
      timestamp: entryDate.getTime(),
      dayKey: item.date
    };
    count++;
  });

  if(!count){
    resultEl.textContent = 'Aucune entrée valide trouvée.';
    return;
  }

  try{
    await db.ref('entries').update(updates);
    resultEl.textContent = `${count} biberon${count > 1 ? 's' : ''} importé${count > 1 ? 's' : ''} avec succès.`;
    showToast(`${count} biberons importés`);
  }catch(e){
    resultEl.textContent = "Erreur lors de l'import.";
  }
});

selectDiaper('none');
setDateOffset(0);
setNow();
</script>
